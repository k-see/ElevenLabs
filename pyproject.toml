[project]
name = "elevenlabs-narrator"
version = "0.1.0"
description = "Narrate short stories with ElevenLabs text-to-speech (Eleven v4)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.70.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
narrate = "narrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
